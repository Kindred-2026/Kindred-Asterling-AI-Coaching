stages:
  - validate
  - test
  - build

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Pipelines run for merge requests (the pipeline of record for feature
# branches), the default branch, tags and scheduled runs. A push to a feature
# branch that already has an MR does not create a second branch pipeline.
# GitLab's CI_PIPELINE_SOURCE for a scheduled pipeline is "schedule" (not
# "scheduled"); using the wrong value drops scheduled runs targeting non-default
# branches. See https://docs.gitlab.com/ci/jobs/job_rules/.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# Every job below runs exactly one command from the local `pnpm verify`
# component list (scripts/verify.mjs) through the shared runner
# (scripts/ci-run.mjs), which applies the same safe child environment as local
# verify. Pinned Node/pnpm toolchain and a frozen, store-cached install.
# Dependency cache only — never build output.
.pnpm-job:
  image: node:24-bookworm-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.28.1 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

# Database test jobs need libcurl4 for the API server test environment and run
# with the same safe defaults as `pnpm verify`. Replaces .pnpm-job
# before_script with the same steps plus the system library.
.db-test-job:
  extends: .pnpm-job
  stage: test
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends libcurl4
    - rm -rf /var/lib/apt/lists/*
    - corepack enable
    - corepack prepare pnpm@10.28.1 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  variables:
    NODE_ENV: test
    HELCIM_PAYMENTS_ENABLED: "false"

format:check:
  extends: .pnpm-job
  stage: validate
  script:
    - node scripts/ci-run.mjs format:check

typecheck:production:
  extends: .pnpm-job
  stage: validate
  script:
    - node scripts/ci-run.mjs typecheck:production

test:dev-supervisor:
  extends: .pnpm-job
  stage: validate
  script:
    - node scripts/ci-run.mjs test:dev-supervisor

test:verify:
  extends: .pnpm-job
  stage: validate
  script:
    - node scripts/ci-run.mjs test:verify

test:release-check:
  extends: .pnpm-job
  stage: validate
  script:
    - node scripts/ci-run.mjs test:release-check

generate:check:
  extends: .pnpm-job
  stage: validate
  script:
    - node scripts/ci-run.mjs generate:check

test:frontend:
  extends: .pnpm-job
  stage: test
  variables:
    NODE_ENV: test
    HELCIM_PAYMENTS_ENABLED: "false"
  script:
    - node scripts/ci-run.mjs test:frontend

test:api:
  extends: .db-test-job
  script:
    - node scripts/ci-run.mjs test:api

test:journey:
  extends: .db-test-job
  script:
    - node scripts/ci-run.mjs test:journey

build:api:
  extends: .pnpm-job
  stage: build
  script:
    - node scripts/ci-run.mjs build:api

build:frontend:
  extends: .pnpm-job
  stage: build
  # Compile-only fixtures. Deployments must use reviewed public Auth0 values.
  variables:
    VITE_AUTH0_DOMAIN: "tenant.example.invalid"
    VITE_AUTH0_CLIENT_ID: "synthetic-public-client"
    VITE_AUTH0_AUDIENCE: "https://api.example.invalid"
  script:
    - node scripts/ci-run.mjs build:frontend
