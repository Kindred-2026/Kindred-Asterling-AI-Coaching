name: Deploy to DigitalOcean

# Manual only, like the Fly and Cloudflare deploys: a deploy is an
# outward-facing action, so it never runs on push. Applies .do/app.yaml and
# deploys the latest commit on main (docs/DIGITALOCEAN_DEPLOYMENT.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digitalocean-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DIGITALOCEAN_ACCESS_TOKEN is a personal access token with App Platform
      # access. The VITE_AUTH0_* values are public browser identifiers stored
      # as GitHub variables; the frontend build fails without them. Runtime
      # secrets stay in App Platform and are carried over by this step.
      - name: Prepare app spec
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: |
          for name in DIGITALOCEAN_ACCESS_TOKEN VITE_AUTH0_DOMAIN VITE_AUTH0_CLIENT_ID VITE_AUTH0_AUDIENCE; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done
          node scripts/digitalocean-app-spec.mjs .do/app.yaml deploy-spec.json

      # The action fills ${VITE_AUTH0_*} in the spec from its environment and
      # leaves App Platform references such as ${kindred-db.DATABASE_URL}.
      - name: Deploy
        id: deploy
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: deploy-spec.json
          print_build_logs: true
          print_deploy_logs: true

      # Fails the run if rate limits would not see real visitor IPs, which
      # means TRUST_PROXY_HOPS in .do/app.yaml is wrong for App Platform.
      - name: Check visitor IPs reach the rate limiter
        env:
          APP_JSON: ${{ steps.deploy.outputs.app }}
        run: |
          host="$(node -e 'console.log(JSON.parse(process.env.APP_JSON).default_ingress.replace(/^https?:\/\//, "").replace(/\/.*$/, ""))')"
          node scripts/check-client-ip.mjs "https://$host"
