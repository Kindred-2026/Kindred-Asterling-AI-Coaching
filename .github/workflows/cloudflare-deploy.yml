name: Deploy to Cloudflare

# Manual only, like the Fly deploy: a deploy is an outward-facing action, so it
# never runs on push. Deploys the marketing site (wrangler.jsonc) as a
# Cloudflare Worker serving static assets. If Workers Builds is also connected
# to this repository in the Cloudflare dashboard, disconnect it or the two will
# deploy the same Worker twice.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # VITE_APP_URL makes sign-in, checkout and signed-in pages hand off to
      # the app domain (docs/DOMAIN_SPLIT.md). The build writes the _headers
      # file next to the static assets.
      - name: Build marketing site
        env:
          VITE_APP_URL: https://kindred-asterling-ai-coaching.com
        run: pnpm --filter @workspace/kindred-coach run build

      # CLOUDFLARE_API_TOKEN needs the "Edit Cloudflare Workers" template plus
      # Zone > DNS > Edit on kindred-asterling-ai.xyz, because wrangler creates
      # the custom-domain DNS records itself.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done
          npx --yes wrangler@4 deploy --config wrangler.jsonc
