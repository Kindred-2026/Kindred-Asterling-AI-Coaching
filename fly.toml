# fly.toml app configuration file generated for kindred-asterling-staging-20260924 on 2026-09-24T18:47:59-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kindred-asterling-staging-20260924'
primary_region = 'yyz'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATABASE_PROVIDER = 'mongo'
  APP_PUBLIC_URL = 'https://kindred-asterling-staging-20260924.fly.dev'
  AI_PROVIDER = 'disabled'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/healthz/db'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
