# fly.toml app configuration file generated for kindred-asterling-ai-coaching on 2026-09-25T22:41:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kindred-asterling-ai-coaching'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

  # The frontend build refuses to run without the public Auth0 SPA settings.
  # These are public browser identifiers (never a client secret). Either keep
  # passing them with `--build-secret` (see docs/FLY_DEPLOYMENT.md) or fill in
  # and uncomment these so a plain `fly deploy` / Fly dashboard build works.
  # [build.args]
  #   VITE_AUTH0_DOMAIN = 'YOUR-TENANT.ca.auth0.com'
  #   VITE_AUTH0_CLIENT_ID = 'YOUR-SPA-CLIENT-ID'
  #   VITE_AUTH0_AUDIENCE = 'https://kindred-asterling-ai-coaching.com/api'

[env]
  # Claude via the Anthropic API. Requires the ANTHROPIC_API_KEY Fly secret;
  # the app refuses to start without it while this is 'anthropic'.
  AI_PROVIDER = 'anthropic'
  ANTHROPIC_MODEL = 'claude-opus-5'
  ANTHROPIC_EFFORT = 'low'
  # Optional Cloudflare AI Gateway (see docs/CLOUDFLARE_SETUP.md). Pair it with
  # the CLOUDFLARE_AI_GATEWAY_TOKEN Fly secret when the gateway is authenticated.
  # ANTHROPIC_BASE_URL = 'https://gateway.ai.cloudflare.com/v1/ACCOUNT_ID/kindred/anthropic'
  AI_REQUEST_TIMEOUT_MS = '60000'
  APP_PUBLIC_URL = 'https://kindred-asterling-ai-coaching.fly.dev'
  DATABASE_PROVIDER = 'postgres'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/healthz/db'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
