openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kindred Coach API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: morning
    description: Morning baseline logs
  - name: scans
    description: Interval body scans
  - name: evening
    description: Evening reports
  - name: habits
    description: Goals and habit tracking
  - name: dashboard
    description: Dashboard summaries
  - name: affirmations
    description: Daily positive affirmations
  - name: profile
    description: User profile fields collected during onboarding
  - name: medications
    description: Medication schedule and intake log
  - name: chat
    description: AI coaching chat and archive
  - name: subscription
    description: Helcim subscription access status

paths:
  /subscription/status:
    get:
      tags: [subscription]
      operationId: getSubscriptionStatus
      summary: Get the current user's subscription access status
      security:
        - auth0Bearer: []
      responses:
        "200":
          description: Subscription status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "401":
          description: Not authenticated.
  /subscription/checkout:
    post:
      tags: [subscription]
      operationId: createCheckout
      summary: Create a Helcim hosted checkout link for the selected plan
      security:
        - auth0Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutInput"
      responses:
        "200":
          description: Checkout link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutLink"
        "401":
          description: Not authenticated.
        "503":
          description: Checkout is not configured yet.
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      security:
        - auth0Bearer: []
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /morning-logs:
    get:
      operationId: listMorningLogs
      tags: [morning]
      summary: List morning baseline logs
      responses:
        "200":
          description: List of morning logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MorningLog"
    post:
      operationId: createMorningLog
      tags: [morning]
      summary: Create a morning baseline log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MorningLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningLog"

  /morning-logs/{id}:
    get:
      operationId: getMorningLog
      tags: [morning]
      summary: Get a morning log by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Morning log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningLog"
        "404":
          description: Not found

  /body-scans:
    get:
      operationId: listBodyScans
      tags: [scans]
      summary: List body scans
      responses:
        "200":
          description: List of body scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BodyScan"
    post:
      operationId: createBodyScan
      tags: [scans]
      summary: Log a body scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyScanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyScan"

  /evening-reports:
    get:
      operationId: listEveningReports
      tags: [evening]
      summary: List evening reports
      responses:
        "200":
          description: List of evening reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EveningReport"
    post:
      operationId: createEveningReport
      tags: [evening]
      summary: Create an evening report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EveningReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EveningReport"

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a new habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits/{id}/entries:
    get:
      operationId: listHabitEntries
      tags: [habits]
      summary: Get entries for a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of habit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitEntry"
    post:
      operationId: logHabitEntry
      tags: [habits]
      summary: Log a habit entry for today
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitEntry"

  /affirmations:
    get:
      operationId: listAffirmations
      tags: [affirmations]
      summary: List all active affirmations
      responses:
        "200":
          description: All active affirmations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Affirmation"

  /affirmations/today:
    get:
      operationId: getTodayAffirmation
      tags: [affirmations]
      summary: Get today's positive affirmation
      responses:
        "200":
          description: A single affirmation chosen for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"
  /affirmations/random:
    get:
      operationId: getRandomAffirmation
      tags: [affirmations]
      summary: Get a random affirmation (used for the reshuffle button)
      responses:
        "200":
          description: A random affirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"

  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile fields (used by onboarding flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /reminder-settings:
    get:
      operationId: getReminderSettings
      tags: [profile]
      summary: Get the current user's reminder settings (creates defaults if missing)
      responses:
        "200":
          description: Reminder settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSettings"
    patch:
      operationId: updateReminderSettings
      tags: [profile]
      summary: Update the current user's reminder settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderSettingsUpdateInput"
      responses:
        "200":
          description: Updated reminder settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSettings"

  /chat/active:
    get:
      operationId: getActiveChat
      tags: [chat]
      summary: Get the current active conversation with messages (creates one if missing)
      responses:
        "200":
          description: Active conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationWithMessages"

  /chat/send:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Append a user message and get the AI response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSendInput"
      responses:
        "200":
          description: Updated conversation with both messages appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationWithMessages"

  /chat/append:
    post:
      operationId: appendChatMessage
      tags: [chat]
      summary: Append a pre-composed message without invoking the AI (used by onboarding script)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatAppendInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationWithMessages"

  /chat/archive:
    post:
      operationId: archiveActiveChat
      tags: [chat]
      summary: Archive the current active conversation and start a fresh one
      responses:
        "200":
          description: New active conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationWithMessages"

  /chat/archived:
    get:
      operationId: listArchivedChats
      tags: [chat]
      summary: List the user's archived conversations
      responses:
        "200":
          description: Archived conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatConversation"

  /chat/archived/{id}:
    get:
      operationId: getArchivedChat
      tags: [chat]
      summary: Get an archived conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationWithMessages"
        "404":
          description: Not found

  /medications:
    get:
      operationId: listMedications
      tags: [medications]
      summary: List the current user's medications with today's intake status
      parameters:
        - name: tzOffset
          in: query
          required: false
          description: >
            Client time-zone offset in minutes as returned by JavaScript
            Date.getTimezoneOffset() (UTC minus local; e.g. 300 for UTC-5).
            Used to resolve "today" in the user's local day. Defaults to 0 (UTC).
          schema:
            type: integer
            minimum: -840
            maximum: 840
      responses:
        "200":
          description: Medications with today flag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicationWithStatus"
    post:
      operationId: createMedication
      tags: [medications]
      summary: Create a medication entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationInput"
      responses:
        "201":
          description: Created medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"

  /medications/{id}:
    patch:
      operationId: updateMedication
      tags: [medications]
      summary: Update a medication entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationInput"
      responses:
        "200":
          description: Updated medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "404":
          description: Not found
    delete:
      operationId: deleteMedication
      tags: [medications]
      summary: Delete a medication entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /medications/weekly-report:
    get:
      operationId: getMedicationWeeklyReport
      tags: [medications]
      summary: Raw 7-day dose data for all medications, for client-side on-time/missed/upcoming labeling
      parameters:
        - name: tzOffset
          in: query
          required: false
          description: >
            Client time-zone offset in minutes as returned by JavaScript
            Date.getTimezoneOffset() (UTC minus local; e.g. 300 for UTC-5).
            Used so the 7-day window, day columns, and createdDate are computed
            in the user's local day — matching how doses are recorded. Defaults to 0 (UTC).
          schema:
            type: integer
            minimum: -840
            maximum: 840
      responses:
        "200":
          description: Weekly report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationWeeklyReport"

  /medications/{id}/log:
    post:
      operationId: logMedicationTaken
      tags: [medications]
      summary: Mark a specific scheduled dose as taken today (idempotent); optionally rate effectiveness 1-10
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationLogInput"
      responses:
        "201":
          description: Log entry recorded or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationLog"
        "404":
          description: Not found
    delete:
      operationId: unlogMedicationTaken
      tags: [medications]
      summary: Remove today's taken log for a specific scheduled dose
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationDoseRef"
      responses:
        "204":
          description: Removed
        "404":
          description: Not found

  /dashboard/today:
    get:
      operationId: getTodaySummary
      tags: [dashboard]
      summary: Get today's progress summary
      parameters:
        - name: tzOffset
          in: query
          required: false
          description: >
            Client time-zone offset in minutes as returned by JavaScript
            Date.getTimezoneOffset() (UTC minus local; e.g. 300 for UTC-5).
            Used to resolve "today" in the user's local day. Defaults to 0 (UTC).
          schema:
            type: integer
            minimum: -840
            maximum: 840
      responses:
        "200":
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummary"

  /dashboard/streaks:
    get:
      operationId: getStreaks
      tags: [dashboard]
      summary: Get habit streaks
      responses:
        "200":
          description: Habit streaks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitStreak"

  /dashboard/mood-trend:
    get:
      operationId: getMoodTrend
      tags: [dashboard]
      summary: Get mood/mental load trend for the past 7 days
      responses:
        "200":
          description: Mood trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodTrendPoint"

security:
  - auth0Bearer: []

components:
  securitySchemes:
    auth0Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 API access token obtained through the Auth0 SDK.
  schemas:
    SubscriptionStatus:
      type: object
      required: [active, status, currentPeriodEnd, source, subscribeUrl]
      properties:
        active:
          type: boolean
          description: Whether the user currently has access.
        status:
          type: string
          description: Resolved status (active, inactive, bypass, etc.).
        currentPeriodEnd:
          type: string
          nullable: true
          format: date-time
        source:
          type: string
          description: "Access source: owner, beta, helcim, or none."
        subscribeUrl:
          type: string
          nullable: true
          description: Link to the Helcim portal for subscription management.
    CreateCheckoutInput:
      type: object
      required: [planType]
      properties:
        planType:
          type: string
          enum: [yearly, lifetime]
          description: Which plan the user is purchasing.
    CheckoutLink:
      type: object
      required: [checkoutUrl]
      properties:
        checkoutUrl:
          type: string
          description: Helcim-hosted checkout URL to redirect the buyer to.
    AuthUser:
      type: object
      required:
        [
          id,
          email,
          firstName,
          lastName,
          profileImageUrl,
          preferredName,
          birthday,
          struggles,
          strengths,
          interests,
          bio,
          motivationalQuote,
          phone,
          timezone,
          onboardedAt,
        ]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        preferredName:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        struggles:
          type: string
          nullable: true
        strengths:
          type: string
          nullable: true
        interests:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        motivationalQuote:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        onboardedAt:
          type: string
          nullable: true
          format: date-time
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MorningLog:
      type: object
      required: [id, date, mentalLoadLevel, miniGoals, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        mentalLoadLevel:
          type: string
        miniGoals:
          type: array
          items:
            type: string
        notes:
          type: string
          nullable: true
        createdAt:
          type: string

    MorningLogInput:
      type: object
      required: [date, mentalLoadLevel, miniGoals]
      properties:
        date:
          type: string
        mentalLoadLevel:
          type: string
        miniGoals:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
        notes:
          type: string
          maxLength: 2000

    BodyScan:
      type: object
      required: [id, scannedAt, feelings, energyLevel, createdAt]
      properties:
        id:
          type: integer
        scannedAt:
          type: string
        feelings:
          type: array
          items:
            type: string
        energyLevel:
          type: integer
        physicalSensations:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string

    BodyScanInput:
      type: object
      required: [feelings, energyLevel]
      properties:
        scannedAt:
          type: string
        feelings:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        energyLevel:
          type: integer
        physicalSensations:
          type: string
          maxLength: 2000
        notes:
          type: string
          maxLength: 2000

    EveningReport:
      type: object
      required: [id, date, medicationEffectiveness, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        medicationEffectiveness:
          type: integer
        overallMood:
          type: string
          nullable: true
        wins:
          type: string
          nullable: true
        challenges:
          type: string
          nullable: true
        tomorrowIntent:
          type: string
          nullable: true
        createdAt:
          type: string

    EveningReportInput:
      type: object
      required: [date, medicationEffectiveness]
      properties:
        date:
          type: string
        medicationEffectiveness:
          type: integer
        overallMood:
          type: string
          maxLength: 500
        wins:
          type: string
          maxLength: 2000
        challenges:
          type: string
          maxLength: 2000
        tomorrowIntent:
          type: string
          maxLength: 2000

    Habit:
      type: object
      required: [id, name, targetDays, startDate, completedCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        targetDays:
          type: integer
        startDate:
          type: string
        completedCount:
          type: integer
        createdAt:
          type: string

    HabitInput:
      type: object
      required: [name, targetDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        targetDays:
          type: integer
        startDate:
          type: string

    HabitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        targetDays:
          type: integer

    HabitEntry:
      type: object
      required: [id, habitId, date, completed, createdAt]
      properties:
        id:
          type: integer
        habitId:
          type: integer
        date:
          type: string
        completed:
          type: boolean
        notes:
          type: string
          nullable: true
        createdAt:
          type: string

    HabitEntryInput:
      type: object
      required: [date, completed]
      properties:
        date:
          type: string
        completed:
          type: boolean
        notes:
          type: string
          maxLength: 500

    TodaySummary:
      type: object
      required:
        [
          date,
          morningDone,
          eveningDone,
          bodyScansCount,
          habitsCompletedToday,
          totalHabits,
        ]
      properties:
        date:
          type: string
        morningDone:
          type: boolean
        eveningDone:
          type: boolean
        bodyScansCount:
          type: integer
        habitsCompletedToday:
          type: integer
        totalHabits:
          type: integer
        currentMentalLoad:
          type: string
          nullable: true

    HabitStreak:
      type: object
      required:
        [
          habitId,
          habitName,
          currentStreak,
          longestStreak,
          completedCount,
          targetDays,
        ]
      properties:
        habitId:
          type: integer
        habitName:
          type: string
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedCount:
          type: integer
        targetDays:
          type: integer

    ProfileUpdateInput:
      type: object
      properties:
        preferredName:
          type: string
          nullable: true
          maxLength: 80
        birthday:
          type: string
          nullable: true
          format: date
        struggles:
          type: string
          nullable: true
          maxLength: 500
        strengths:
          type: string
          nullable: true
          maxLength: 500
        interests:
          type: string
          nullable: true
          maxLength: 500
        bio:
          type: string
          nullable: true
          maxLength: 1000
        motivationalQuote:
          type: string
          nullable: true
          maxLength: 280
        phone:
          type: string
          nullable: true
          maxLength: 32
          description: Phone number in E.164 format (e.g. +14155550123) for SMS reminders.
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: IANA timezone name (e.g. America/New_York) used to schedule reminders.
        onboardedAt:
          type: string
          nullable: true
          format: date-time
      additionalProperties: false

    ReminderSettings:
      type: object
      required:
        [
          morningEnabled,
          morningTime,
          medicationEnabled,
          eveningEnabled,
          eveningTime,
          smsEnabled,
          emailEnabled,
        ]
      properties:
        morningEnabled:
          type: boolean
        morningTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Local time (HH:MM, 24h) for the morning check-in reminder.
        medicationEnabled:
          type: boolean
        eveningEnabled:
          type: boolean
        eveningTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Local time (HH:MM, 24h) for the evening reflection reminder.
        smsEnabled:
          type: boolean
        emailEnabled:
          type: boolean

    ReminderSettingsUpdateInput:
      type: object
      properties:
        morningEnabled:
          type: boolean
        morningTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        medicationEnabled:
          type: boolean
        eveningEnabled:
          type: boolean
        eveningTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        smsEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        phone:
          type: string
          nullable: true
          maxLength: 32
          description: Phone number in E.164 format (e.g. +14155550123) for SMS reminders. Saved on the user profile in the same transaction.
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: IANA timezone name (e.g. America/New_York) used to schedule reminders. Saved on the user profile in the same transaction.
      additionalProperties: false

    ChatMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatConversation:
      type: object
      required: [id, userId, title, status, createdAt, archivedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time

    ChatConversationWithMessages:
      allOf:
        - $ref: "#/components/schemas/ChatConversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              maxItems: 500
              description: >
                A bounded window of the most recent messages. Live chat endpoints
                return at most 100 messages; the archive export endpoint returns
                at most 500. The server never materialises the full transcript.
              items:
                $ref: "#/components/schemas/ChatMessage"

    ChatSendInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000

    ChatAppendInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000

    Affirmation:
      type: object
      required: [id, text, createdAt]
      properties:
        id:
          type: integer
        text:
          type: string
        createdAt:
          type: string

    Medication:
      type: object
      required: [id, name, dosage, times, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        dosage:
          type: string
        times:
          type: array
          description: One or more HH:MM 24-hour scheduled times for this medication
          minItems: 1
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string

    MedicationInput:
      type: object
      required: [name, dosage, times]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        dosage:
          type: string
          minLength: 1
          maxLength: 100
        times:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        notes:
          type: string
          nullable: true
          maxLength: 500

    MedicationDoseStatus:
      type: object
      required: [scheduledTime, takenAt, effectiveness]
      properties:
        scheduledTime:
          type: string
          description: HH:MM scheduled time for this dose
        takenAt:
          type: string
          nullable: true
          description: ISO timestamp of today's intake for this dose, or null if not taken yet
        effectiveness:
          type: integer
          nullable: true
          description: 1-10 effectiveness rating for this dose today, if rated
          minimum: 1
          maximum: 10

    MedicationWithStatus:
      allOf:
        - $ref: "#/components/schemas/Medication"
        - type: object
          required: [doses, recentEffectivenessAvg, recentEffectivenessCount]
          properties:
            doses:
              type: array
              description: Today's status for each scheduled dose, in time order
              items:
                $ref: "#/components/schemas/MedicationDoseStatus"
            recentEffectivenessAvg:
              type: number
              nullable: true
              description: Average effectiveness over the last 7 days across all doses, or null if no ratings yet
            recentEffectivenessCount:
              type: integer
              description: Number of rated doses in the last 7 days

    MedicationLog:
      type: object
      required: [id, medicationId, date, scheduledTime, takenAt, effectiveness]
      properties:
        id:
          type: integer
        medicationId:
          type: integer
        date:
          type: string
        scheduledTime:
          type: string
        takenAt:
          type: string
        effectiveness:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10

    MedicationDoseRef:
      type: object
      required: [scheduledTime]
      properties:
        scheduledTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Which scheduled dose (HH:MM) to act on
        tzOffset:
          type: integer
          minimum: -840
          maximum: 840
          description: >
            Client time-zone offset in minutes (Date.getTimezoneOffset(), UTC
            minus local). Resolves which local calendar day this dose belongs to.
            Defaults to 0 (UTC) when omitted.
      additionalProperties: false

    MedicationLogInput:
      type: object
      required: [scheduledTime]
      properties:
        scheduledTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Which scheduled dose (HH:MM) is being marked taken
        effectiveness:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: How effective this dose felt, on a 1-10 scale
        tzOffset:
          type: integer
          minimum: -840
          maximum: 840
          description: >
            Client time-zone offset in minutes (Date.getTimezoneOffset(), UTC
            minus local). Resolves which local calendar day this dose belongs to.
            Defaults to 0 (UTC) when omitted.
      additionalProperties: false

    MedicationWeeklyReport:
      type: object
      required: [days, medications, logs]
      properties:
        days:
          type: array
          description: The 7 day-date strings (YYYY-MM-DD), oldest first, that the grid covers
          items:
            type: string
        medications:
          type: array
          items:
            type: object
            required: [id, name, dosage, schedule, createdDate]
            properties:
              id:
                type: integer
              name:
                type: string
              dosage:
                type: string
              schedule:
                type: array
                description: Schedule history — each scheduled time with the date range it was in effect. A time applies to day D iff startDate <= D AND (endDate is null OR D < endDate).
                items:
                  type: object
                  required: [scheduledTime, startDate, endDate]
                  properties:
                    scheduledTime:
                      type: string
                    startDate:
                      type: string
                      description: YYYY-MM-DD, inclusive first day this time was in effect
                    endDate:
                      type: string
                      nullable: true
                      description: YYYY-MM-DD exclusive end day, or null if still active
              createdDate:
                type: string
                description: YYYY-MM-DD the medication was created; days before this are not applicable in the grid
        logs:
          type: array
          description: Every dose log in the window; client matches by medicationId + date + scheduledTime
          items:
            type: object
            required:
              [medicationId, date, scheduledTime, takenAt, effectiveness]
            properties:
              medicationId:
                type: integer
              date:
                type: string
              scheduledTime:
                type: string
              takenAt:
                type: string
              effectiveness:
                type: integer
                nullable: true

    MoodTrendPoint:
      type: object
      required: [date, mentalLoadLevel, bodyScansCount]
      properties:
        date:
          type: string
        mentalLoadLevel:
          type: string
          nullable: true
        bodyScansCount:
          type: integer
        medicationEffectiveness:
          type: integer
          nullable: true
